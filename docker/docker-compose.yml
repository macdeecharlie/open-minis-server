services:
  open-minis-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-minis-server:latest
    container_name: open-minis-server
    restart: unless-stopped
    environment:
      APP_GIT_REPO: https://github.com/macdeecharlie/open-minis-server.git
      APP_GIT_BRANCH: main
      MINIS_CONFIG: /data/config.json
      MINIS_LISTEN: ":8080"
      # Optional: read-only token for the private Android release repo. Set it
      # in ../.env (never in this file) and restart the container.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ../data:/data
    networks:
      - minis_net
    expose:
      - "8080"

networks:
  # A dedicated network for the server and Caddy only. The server's shell
  # tools must not be able to reach the other containers on the `internal`
  # network. Caddy is attached to both networks.
  minis_net:
    external: true
