name: Server checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: app/go.sum
      - name: Format
        run: test -z "$(gofmt -l app/*.go)"
      - name: Vet
        run: cd app && go vet ./...
      - name: Test
        run: cd app && go test -race -count=1 ./...
      - name: Build
        run: cd app && go build ./...
